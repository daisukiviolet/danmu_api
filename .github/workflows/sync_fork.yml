name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

concurrency:
    group: fork-sync-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        # 固定 runner 版本，避免 ubuntu-latest 在 2026-10-19 迁移到 Ubuntu 26 时行为漂移
        runs-on: ubuntu-24.04
        if: ${{ github.event.repository.fork }}

        steps:
            # 用支持 Node 24 的 v5，消除 "Node.js 20 is deprecated" 强制升级告警
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
                  fetch-depth: 0   # 必须是完整历史，否则无法与上游比对祖先关系

            - name: Sync Upstream
              uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
              with:
                  target_repo_token: ${{ secrets.GITHUB_TOKEN }}
                  upstream_sync_repo: huangxd-/danmu_api
                  upstream_sync_branch: main
                  target_sync_branch: main
                  test_mode: false

            - name: Check for new commits
              if: success()
              run: echo "Sync completed successfully"

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. Changes in the upstream workflow file"
                  echo "2. Merge conflicts that need manual resolution"
                  echo "3. Network issues"
                  echo "Please check the logs and consider manual sync if needed."
                  exit 1
