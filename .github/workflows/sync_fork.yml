name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

concurrency:
    group: fork-sync-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        # 固定 runner 版本，避免 ubuntu-latest 在 2026-10-19 迁移到 Ubuntu 26 时行为漂移
        runs-on: ubuntu-24.04
        if: ${{ github.event.repository.fork }}

        steps:
            # 用支持 Node 24 的 v5，消除 "Node.js 20 is deprecated" 强制升级告警
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
                  fetch-depth: 0   # 必须是完整历史，否则无法与上游比对祖先关系

            - name: Sync with Upstream
              env:
                  UPSTREAM_REPO: huangxd-/danmu_api
                  UPSTREAM_BRANCH: main
                  TARGET_BRANCH: main
                  SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
                  DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail

                  git config user.name  "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  # fork 跨库推送需要 repo 权限；GITHUB_TOKEN 只能操作本库，
                  # 这里优先用 PAT，未配置时回退，至少保证 fetch 能work。
                  TOKEN="${SYNC_TOKEN:-$DEFAULT_TOKEN}"

                  git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
                  git fetch upstream "${UPSTREAM_BRANCH}" --no-tags
                  git fetch origin   "${TARGET_BRANCH}" --no-tags

                  echo "::group::Upstream latest"
                  git --no-pager log --oneline -5 "upstream/${UPSTREAM_BRANCH}"
                  echo "::endgroup::"

                  echo "::group::Fork latest"
                  git --no-pager log --oneline -5 "origin/${TARGET_BRANCH}"
                  echo "::endgroup::"

                  # 已经包含上游最新提交 → 无事可做
                  if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${TARGET_BRANCH}"; then
                      echo "Already up to date with upstream. Nothing to sync."
                      exit 0
                  fi

                  # fork HEAD 是上游祖先 → 纯落后，直接快进
                  if git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "upstream/${UPSTREAM_BRANCH}"; then
                      echo "Fork is behind upstream -> fast-forwarding."
                      git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
                      git merge --ff-only "upstream/${UPSTREAM_BRANCH}"
                  else
                      # 分叉：fork 有自己的提交（通常是 .github/workflows 里的自定义配置）。
                      # 策略是「上游优先，保留 fork 自己的那些文件」：
                      #   1. 把上游合并进来，冲突时一律取上游版本（-X theirs）
                      #   2. 再把 fork 独有提交里改动过的文件还原成 fork 的版本
                      # 这样既跟上上游，又不会丢掉 fork 的自定义工作流。
                      echo "Fork has its own commits -> merging upstream, then restoring fork-only files."

                      git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

                      # 先记下 fork 独有提交里修改过的文件清单
                      FORK_FILES=$(git diff --name-only \
                          "$(git merge-base "origin/${TARGET_BRANCH}" "upstream/${UPSTREAM_BRANCH}")" \
                          "origin/${TARGET_BRANCH}")

                      echo "::group::Fork-only changed files"
                      echo "${FORK_FILES}"
                      echo "::endgroup::"

                      # 合并上游；冲突时以「上游」为准（-X theirs 在本上下文指 upstream 侧）
                      if ! git merge --no-edit -X theirs "upstream/${UPSTREAM_BRANCH}"; then
                          echo "::warning::Merge had conflicts even with -X theirs; aborting to be safe."
                          git merge --abort || true
                          echo "::error::Manual merge required. No changes were pushed."
                          exit 1
                      fi

                      # 把 fork 独有改动过的文件还原成 fork 的内容（保留下自定义配置）
                      # 仅处理仍然存在的文件，避免上游已删除的文件导致报错。
                      if [ -n "${FORK_FILES}" ]; then
                          while IFS= read -r f; do
                              [ -z "$f" ] && continue
                              if git cat-file -e "origin/${TARGET_BRANCH}:${f}" 2>/dev/null; then
                                  git checkout "origin/${TARGET_BRANCH}" -- "$f" 2>/dev/null || true
                                  echo "restored fork version: $f"
                              fi
                          done <<< "${FORK_FILES}"

                          git add -A
                          if ! git diff --cached --quiet; then
                              git commit -m "chore: preserve fork-specific files after upstream sync" || true
                          fi
                      fi
                  fi

                  # 推送。分叉合并不需要 force；若因历史原因需要，用 --force-with-lease 更安全。
                  git push \
                      "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" \
                      "HEAD:${TARGET_BRANCH}"

                  echo "Sync completed. Fork now matches upstream/${UPSTREAM_BRANCH}."

            - name: Check for new commits
              if: success()
              run: echo "Sync completed successfully"

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. Changes in the upstream workflow file"
                  echo "2. Merge conflicts that need manual resolution"
                  echo "3. Network issues"
                  echo "Please check the logs and consider manual sync if needed."
                  exit 1
